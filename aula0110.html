<html>
    <head>
        <title>Form</title>
        <link rel="stylesheet" href="AULA0110.CSS">
    </head>
    <body>
        
        <header> MEU FORMULARIO DE CADASTRO</header>


        <h1>FORMULARIO</H1>

        <form action="obrigado.html" method="get">
            <label>NOME COMPLETO</label>
            <input type="text" name="nome" required placeholder="DIGITE SEU NOME" ><br>
            <label>EMAIL</label>
            <input type="email" name="email" required placeholder="DIGITE SEU EMAIL"><br>
            <label>IDADE</label>
            <input type="number" name="idade" required placeholder="DIGITE SUA IDADE"><br>



            <button type="submit" >ENVIAR</button>
        </form>  



    </body>
</html>
